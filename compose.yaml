services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

  app:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public&sslmode=disable
      PORT: 3000
      OFFER_TTL_SECONDS: ${OFFER_TTL_SECONDS:-30}
      OFFER_CANDIDATE_LIMIT: ${OFFER_CANDIDATE_LIMIT:-3}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    ports:
      - "${APP_PORT:-3106}:3000"
    develop:
      watch:
        - action: sync+restart
          path: ./apps/server/src
          target: /app/apps/server/src
        - action: sync+restart
          path: ./apps/server/assets
          target: /app/apps/server/assets
        - action: sync
          path: ./apps/web/public
          target: /app/apps/web/public
        - action: sync
          path: ./docs
          target: /app/docs
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./prisma
        - action: rebuild
          path: ./prisma.config.ts
        - action: rebuild
          path: ./apps/server/Dockerfile
        - action: rebuild
          path: ./apps/server/docker-entrypoint.sh

volumes:
  postgres-data:
